[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spellingbee-solver"
version = "0.1.0"
description = "Solver for the NYT Spelling Bee puzzle"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
spellingbee = "spellingbee.solve:main"

[tool.setuptools.packages.find]
where = ["src"]
